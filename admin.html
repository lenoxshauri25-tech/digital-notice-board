<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center - SDB</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #121620; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { background-color: #1a1f2c; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3245; }
        header h1 { font-size: 1.25rem; font-weight: 600; color: #4facfe; }
        header .user-profile { font-size: 0.9rem; color: #a0aec0; }

        /* Main Workspace Layout */
        .workspace { display: flex; flex: 1; overflow: hidden; }

        /* Left Form Panel */
        .form-panel { flex: 1; padding: 40px; overflow-y: auto; max-width: 600px; border-right: 1px solid #2a3245; }
        .form-panel h2 { font-size: 1.4rem; margin-bottom: 25px; color: #fff; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; background-color: #1a1f2c; border: 1px solid #3b465e; border-radius: 6px; color: #fff; font-size: 1rem; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #007bff; }
        
        .row-group { display: flex; gap: 20px; }
        .row-group .form-group { flex: 1; }
        
        .btn-publish { width: 100%; padding: 14px; background-color: #0052cc; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-publish:hover { background-color: #0066ff; }

        /* Right Preview/Live Panel */
        .live-panel { flex: 1; padding: 40px; overflow-y: auto; background-color: #161b26; }
        .live-panel h2 { font-size: 1.4rem; margin-bottom: 25px; color: #fff; }
        
        /* Live Item Cards */
        .notice-card { background-color: #1a1f2c; border-left: 5px solid #ff4d4d; padding: 15px; border-radius: 4px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .notice-card.warning { border-left-color: #ffad33; }
        .notice-card.info { border-left-color: #33cc33; }
        
        .card-details h3 { font-size: 1.05rem; margin-bottom: 4px; }
        .card-details p { font-size: 0.85rem; color: #a0aec0; }
        
        .btn-delete { background-color: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-delete:hover { background-color: #ff3333; }
    </style>
</head>
<body>

    <header>
        <h1>SCHOOL DIGITAL BOARD | ADMIN CONTROL CENTER</h1>
        <div class="user-profile">Admin: John Doe ▼</div>
    </header>

    <div class="workspace">
        <!-- Form Section -->
        <div class="form-panel">
            <h2>CREATE NEW NOTICE</h2>
            <form id="noticeForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" placeholder="e.g., Urgent: Midterm Exam Schedule" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="Type your announcement details here..." required></textarea>
                </div>
                <div class="row-group">
                    <div class="form-group">
                        <label>Priority</label>
                        <select>
                            <option>High</option>
                            <option>Medium</option>
                            <option>Low</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Duration / Expiry</label>
                        <input type="date">
                    </div>
                </div>
                <button type="submit" class="btn-publish">PUBLISH NOW</button>
            </form>
        </div>

        <!-- Live Monitors Monitoring View -->
        <div class="live-panel">
            <h2>LIVE ON SCREENS</h2>
            
            <div class="notice-card">
                <div class="card-details">
                    <h3>Emergency Closure</h3>
                    <p>Expiring: Today at 5:00 PM</p>
                </div>
                <button class="btn-delete">Remove</button>
            </div>

            <div class="notice-card warning">
                <div class="card-details">
                    <h3>Library Hours Change</h3>
                    <p>Status: Active</p>
                </div>
                <button class="btn-delete">Remove</button>
            </div>

            <div class="notice-card info">
                <div class="card-details">
                    <h3>Science Fair Sign-up</h3>
                    <p>Status: Active</p>
                </div>
                <button class="btn-delete">Remove</button>
            </div>
        </div>
    </div>

    <!-- Add this right before the closing </body> tag -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const noticeForm = document.getElementById('noticeForm');

        noticeForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Stop page from reloading

            // Gather values from the form inputs
            const title = noticeForm.querySelector('input[type="text"]').value;
            const message = noticeForm.querySelector('textarea').value;
            const priority = noticeForm.querySelector('select').value;

            // Package the data
            const noticeData = { title, message, priority };

            // Send data instantly to the backend server
            socket.emit('publish-notice', noticeData);

            // Optional: Clear the input fields after sending
            noticeForm.reset();
            alert('Notice broadcasted successfully!');
        });
    </script>
    </body>

</html>
